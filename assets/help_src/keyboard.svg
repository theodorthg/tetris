<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f121b"/><stop offset="1" stop-color="#0a0c13"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a465e"/><stop offset="1" stop-color="#232b3b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="960" fill="url(#bg)"/>
  <rect x="18" y="18" width="1244" height="924" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <text x="640" y="102" text-anchor="middle" font-size="60" font-weight="700" fill="#eef2fa" letter-spacing="6">KEYBOARD</text>
  <rect x="536" y="122" width="208" height="4" rx="2" fill="#f0c02a"/>

  <!-- helper: each row is  keys...  |  label  -->
  <g>
    <!-- MOVE -->
    <g transform="translate(150 190)">
      <rect x="0" y="0" width="70" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="35" y="47" text-anchor="middle" font-size="34" fill="#e8eefc">&#8592;</text>
      <rect x="80" y="0" width="70" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="115" y="47" text-anchor="middle" font-size="34" fill="#e8eefc">&#8594;</text>
      <text x="176" y="45" font-size="27" fill="#9fb0cc">or</text>
      <rect x="222" y="0" width="70" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="257" y="47" text-anchor="middle" font-size="30" fill="#e8eefc">A</text>
      <rect x="302" y="0" width="70" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="337" y="47" text-anchor="middle" font-size="30" fill="#e8eefc">D</text>
      <text x="470" y="32" font-size="36" font-weight="700" fill="#eef2fa">Move left / right</text>
      <text x="470" y="62" font-size="28" fill="#9fb0cc">hold to auto-repeat</text>
    </g>

    <!-- ROTATE CW -->
    <g transform="translate(150 300)">
      <rect x="0" y="0" width="70" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="35" y="47" text-anchor="middle" font-size="34" fill="#e8eefc">&#8593;</text>
      <text x="80" y="45" font-size="27" fill="#9fb0cc">or</text>
      <rect x="124" y="0" width="70" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="159" y="47" text-anchor="middle" font-size="30" fill="#e8eefc">X</text>
      <text x="470" y="47" font-size="36" font-weight="700" fill="#eef2fa">Rotate clockwise</text>
    </g>

    <!-- ROTATE CCW  (physical key left of X — labelled Y on a German QWERTZ board) -->
    <g transform="translate(150 400)">
      <rect x="0" y="0" width="70" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="35" y="47" text-anchor="middle" font-size="30" fill="#e8eefc">Y</text>
      <text x="470" y="47" font-size="36" font-weight="700" fill="#eef2fa">Rotate counter-clockwise</text>
    </g>

    <!-- SOFT DROP -->
    <g transform="translate(150 500)">
      <rect x="0" y="0" width="70" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="35" y="47" text-anchor="middle" font-size="34" fill="#e8eefc">&#8595;</text>
      <text x="80" y="45" font-size="27" fill="#9fb0cc">or</text>
      <rect x="124" y="0" width="70" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="159" y="47" text-anchor="middle" font-size="30" fill="#e8eefc">S</text>
      <text x="470" y="32" font-size="36" font-weight="700" fill="#eef2fa">Soft drop</text>
      <text x="470" y="62" font-size="28" fill="#9fb0cc">fall faster, +1 point per row</text>
    </g>

    <!-- HARD DROP -->
    <g transform="translate(150 600)">
      <rect x="0" y="0" width="214" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="107" y="46" text-anchor="middle" font-size="27" fill="#e8eefc">Space</text>
      <text x="470" y="32" font-size="36" font-weight="700" fill="#eef2fa">Hard drop</text>
      <text x="470" y="62" font-size="28" fill="#9fb0cc">slam down &amp; lock, +2 per row</text>
    </g>

    <!-- HOLD -->
    <g transform="translate(150 700)">
      <rect x="0" y="0" width="70" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="35" y="47" text-anchor="middle" font-size="30" fill="#e8eefc">C</text>
      <text x="80" y="45" font-size="27" fill="#9fb0cc">or</text>
      <rect x="124" y="0" width="96" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="172" y="46" text-anchor="middle" font-size="25" fill="#e8eefc">End</text>
      <text x="470" y="47" font-size="36" font-weight="700" fill="#eef2fa">Hold piece</text>
    </g>

    <!-- PAUSE -->
    <g transform="translate(150 800)">
      <rect x="0" y="0" width="86" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="43" y="46" text-anchor="middle" font-size="25" fill="#e8eefc">Esc</text>
      <text x="96" y="45" font-size="27" fill="#9fb0cc">or</text>
      <rect x="140" y="0" width="70" height="70" rx="10" fill="url(#key)" stroke="#5a6a86" stroke-width="2"/><text x="175" y="47" text-anchor="middle" font-size="30" fill="#e8eefc">P</text>
      <text x="470" y="47" font-size="36" font-weight="700" fill="#eef2fa">Pause</text>
    </g>
  </g>

  <text x="640" y="922" text-anchor="middle" font-size="26" fill="#8fa0bc">a gamepad works too — d-pad to move, face buttons to rotate / drop / hold</text>
</svg>
