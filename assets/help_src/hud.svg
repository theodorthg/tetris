<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f121b"/><stop offset="1" stop-color="#0a0c13"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="960" fill="url(#bg)"/>
  <rect x="18" y="18" width="1244" height="924" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <text x="640" y="96" text-anchor="middle" font-size="60" font-weight="700" fill="#eef2fa" letter-spacing="5">THE BUTTONS</text>
  <rect x="512" y="116" width="256" height="4" rx="2" fill="#f0c02a"/>
  <text x="640" y="170" text-anchor="middle" font-size="40" fill="#9fb0cc">two frosted icons in the top corners — never over the field</text>

  <!-- HOLD -->
  <g transform="translate(240 292)">
    <circle cx="0" cy="0" r="72" fill="#d9e6ff" fill-opacity="0.14" stroke="#d9e6ff" stroke-opacity="0.35" stroke-width="3"/>
    <g stroke="#e8eefc" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-30 -13 L 28 -13"/><path d="M15 -27 L 30 -13 L 15 1"/>
      <path d="M30 15 L -28 15"/><path d="M-15 1 L -30 15 L -15 29"/>
    </g>
  </g>
  <text x="350" y="252" font-size="46" font-weight="700" fill="#eef2fa">HOLD</text>
  <text x="350" y="306" font-size="40" fill="#c7d2e6">Park the current piece. Tap again to swap</text>
  <text x="350" y="352" font-size="40" fill="#c7d2e6">it back in — once per piece.</text>
  <text x="350" y="400" font-size="40" fill="#9fb0cc">keyboard: C / End   ·   mouse: right-click</text>

  <!-- PAUSE -->
  <g transform="translate(240 560)">
    <circle cx="0" cy="0" r="72" fill="#d9e6ff" fill-opacity="0.14" stroke="#d9e6ff" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#e8eefc" stroke-width="6"/>
    <rect x="-19" y="-23" width="15" height="46" rx="4" fill="#e8eefc"/>
    <rect x="4" y="-23" width="15" height="46" rx="4" fill="#e8eefc"/>
  </g>
  <text x="350" y="520" font-size="46" font-weight="700" fill="#eef2fa">PAUSE</text>
  <text x="350" y="574" font-size="40" fill="#c7d2e6">Open the menu: resume, settings,</text>
  <text x="350" y="620" font-size="40" fill="#c7d2e6">how to play, restart.</text>
  <text x="350" y="668" font-size="40" fill="#9fb0cc">keyboard: Esc / P</text>

  <!-- where they sit on screen -->
  <rect x="546" y="762" width="188" height="150" rx="6" fill="#0c0f17" stroke="#2c3547" stroke-width="3"/>
  <g stroke="#1b2230" stroke-width="1">
    <line x1="593" y1="762" x2="593" y2="912"/><line x1="640" y1="762" x2="640" y2="912"/><line x1="687" y1="762" x2="687" y2="912"/>
    <line x1="546" y1="812" x2="734" y2="812"/><line x1="546" y1="862" x2="734" y2="862"/>
  </g>
  <g transform="translate(528 774)">
    <circle cx="0" cy="0" r="30" fill="#d9e6ff" fill-opacity="0.16" stroke="#d9e6ff" stroke-opacity="0.4" stroke-width="2"/>
    <g stroke="#e8eefc" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M-13 -5 L 12 -5"/><path d="M6 -12 L 13 -5 L 6 2"/><path d="M13 5 L -12 5"/><path d="M-6 2 L -13 5 L -6 12"/></g>
  </g>
  <g transform="translate(752 774)">
    <circle cx="0" cy="0" r="30" fill="#d9e6ff" fill-opacity="0.16" stroke="#d9e6ff" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="0" cy="0" r="17" fill="none" stroke="#e8eefc" stroke-width="3"/>
    <rect x="-7" y="-9" width="5.5" height="18" rx="1.5" fill="#e8eefc"/><rect x="1.5" y="-9" width="5.5" height="18" rx="1.5" fill="#e8eefc"/>
  </g>
  <rect x="550" y="768" width="58" height="40" rx="4" fill="#0c0f17" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <g fill="#a64bd6"><rect x="569" y="779" width="9" height="9"/><rect x="560" y="789" width="9" height="9"/><rect x="569" y="789" width="9" height="9"/><rect x="578" y="789" width="9" height="9"/></g>
  <rect x="672" y="768" width="58" height="40" rx="4" fill="#0c0f17" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <g fill="#e88b2a"><rect x="683" y="789" width="9" height="9"/><rect x="692" y="789" width="9" height="9"/><rect x="701" y="789" width="9" height="9"/><rect x="701" y="779" width="9" height="9"/></g>

  <text x="496" y="812" text-anchor="end" font-size="40" fill="#9fb0cc">Hold +</text>
  <text x="496" y="858" text-anchor="end" font-size="40" fill="#9fb0cc">held piece</text>
  <text x="784" y="812" font-size="40" fill="#9fb0cc">Pause +</text>
  <text x="784" y="858" font-size="40" fill="#9fb0cc">next piece</text>
</svg>
