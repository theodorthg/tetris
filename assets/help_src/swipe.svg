<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f121b"/><stop offset="1" stop-color="#0a0c13"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0c02a"/>
    </marker>
  </defs>
  <rect width="960" height="1280" fill="url(#bg)"/>
  <rect x="16" y="16" width="928" height="1248" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <text x="480" y="96" text-anchor="middle" font-size="58" font-weight="700" fill="#eef2fa" letter-spacing="4">SWIPE &amp; TAP</text>
  <rect x="360" y="116" width="240" height="4" rx="2" fill="#f0c02a"/>
  <text x="480" y="158" text-anchor="middle" font-size="25" fill="#9fb0cc">swipe anywhere on the screen — no on-screen pad</text>

  <!-- board -->
  <rect x="330" y="230" width="300" height="600" rx="8" fill="#0c0f17" stroke="#2c3547" stroke-width="3"/>
  <g stroke="#1b2230" stroke-width="1">
    <line x1="390" y1="230" x2="390" y2="830"/><line x1="450" y1="230" x2="450" y2="830"/>
    <line x1="510" y1="230" x2="510" y2="830"/><line x1="570" y1="230" x2="570" y2="830"/>
    <line x1="330" y1="350" x2="630" y2="350"/><line x1="330" y1="470" x2="630" y2="470"/>
    <line x1="330" y1="590" x2="630" y2="590"/><line x1="330" y1="710" x2="630" y2="710"/>
  </g>
  <!-- a piece + ghost -->
  <g fill="#a64bd6"><rect x="451" y="231" width="58" height="58"/><rect x="391" y="289" width="58" height="58"/><rect x="451" y="289" width="58" height="58"/><rect x="511" y="289" width="58" height="58"/></g>
  <g fill="#a64bd6" fill-opacity="0.15" stroke="#a64bd6" stroke-width="3" stroke-dasharray="7 5">
    <rect x="392" y="710" width="56" height="56"/><rect x="392" y="768" width="56" height="56"/>
    <rect x="452" y="768" width="56" height="56"/><rect x="512" y="768" width="56" height="56"/>
  </g>

  <!-- horizontal swipe arrow across the board -->
  <g stroke="#f0c02a" stroke-width="6" fill="none">
    <line x1="250" y1="530" x2="710" y2="530" marker-start="url(#ah)" marker-end="url(#ah)"/>
  </g>

  <!-- callouts -->
  <g>
    <text x="480" y="900" text-anchor="middle" font-size="30" font-weight="700" fill="#eef2fa">Swipe left / right  —  aim the column</text>
    <text x="480" y="936" text-anchor="middle" font-size="23" fill="#9fb0cc">one cell per short drag; the ghost auto-fits the rotation</text>

    <g transform="translate(120 1000)">
      <circle cx="26" cy="0" r="26" fill="#d9e6ff" fill-opacity="0.12" stroke="#d9e6ff" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="26" cy="0" r="7" fill="#e8eefc"/>
      <text x="72" y="-4" font-size="28" font-weight="700" fill="#eef2fa">Tap  —  hard drop</text>
      <text x="72" y="28" font-size="22" fill="#9fb0cc">drop it straight to the ghost</text>
    </g>
    <g transform="translate(120 1090)">
      <circle cx="12" cy="0" r="24" fill="#d9e6ff" fill-opacity="0.12" stroke="#d9e6ff" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="40" cy="0" r="24" fill="#d9e6ff" fill-opacity="0.12" stroke="#d9e6ff" stroke-opacity="0.3" stroke-width="2"/>
      <text x="86" y="-4" font-size="28" font-weight="700" fill="#eef2fa">Double-tap  —  rotate</text>
      <text x="86" y="28" font-size="22" fill="#9fb0cc">override the auto-fit orientation</text>
    </g>
    <g transform="translate(120 1180)">
      <path d="M20 -22 L20 18" stroke="#e8eefc" stroke-width="6" fill="none" marker-end="url(#ah)"/>
      <text x="86" y="-4" font-size="28" font-weight="700" fill="#eef2fa">Hold &amp; drag down  —  soft drop</text>
      <text x="86" y="28" font-size="22" fill="#9fb0cc">ease it down faster</text>
    </g>
  </g>
</svg>
