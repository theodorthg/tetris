<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f121b"/><stop offset="1" stop-color="#0a0c13"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="960" fill="url(#bg)"/>
  <rect x="18" y="18" width="1244" height="924" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <text x="640" y="104" text-anchor="middle" font-size="60" font-weight="700" fill="#eef2fa" letter-spacing="5">THE BUTTONS</text>
  <rect x="512" y="124" width="256" height="4" rx="2" fill="#f0c02a"/>
  <text x="640" y="176" text-anchor="middle" font-size="29" fill="#9fb0cc">two frosted icons in the top corners — never over the field</text>

  <!-- HOLD -->
  <g transform="translate(330 320)">
    <circle cx="0" cy="0" r="84" fill="#d9e6ff" fill-opacity="0.14" stroke="#d9e6ff" stroke-opacity="0.35" stroke-width="3"/>
    <g stroke="#e8eefc" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-34 -15 L 32 -15"/><path d="M17 -31 L 34 -15 L 17 1"/>
      <path d="M34 17 L -32 17"/><path d="M-17 1 L -34 17 L -17 33"/>
    </g>
  </g>
  <text x="330" y="470" text-anchor="middle" font-size="40" font-weight="700" fill="#eef2fa">HOLD</text>
  <text x="330" y="518" text-anchor="middle" font-size="30" fill="#c7d2e6">Park the current piece.</text>
  <text x="330" y="556" text-anchor="middle" font-size="30" fill="#c7d2e6">Tap again to swap it back —</text>
  <text x="330" y="594" text-anchor="middle" font-size="30" fill="#c7d2e6">once per piece.</text>
  <text x="330" y="640" text-anchor="middle" font-size="25" fill="#8fa0bc">keyboard C / End · right-click</text>

  <!-- PAUSE -->
  <g transform="translate(950 320)">
    <circle cx="0" cy="0" r="84" fill="#d9e6ff" fill-opacity="0.14" stroke="#d9e6ff" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#e8eefc" stroke-width="7"/>
    <rect x="-22" y="-26" width="17" height="52" rx="4" fill="#e8eefc"/>
    <rect x="5" y="-26" width="17" height="52" rx="4" fill="#e8eefc"/>
  </g>
  <text x="950" y="470" text-anchor="middle" font-size="40" font-weight="700" fill="#eef2fa">PAUSE</text>
  <text x="950" y="518" text-anchor="middle" font-size="30" fill="#c7d2e6">Open the menu: resume,</text>
  <text x="950" y="556" text-anchor="middle" font-size="30" fill="#c7d2e6">settings, how to play, restart.</text>
  <text x="950" y="640" text-anchor="middle" font-size="25" fill="#8fa0bc">keyboard Esc / P</text>

  <!-- placement: a mini board with the two icons at its top corners -->
  <rect x="556" y="708" width="168" height="210" rx="6" fill="#0c0f17" stroke="#2c3547" stroke-width="3"/>
  <g stroke="#1b2230" stroke-width="1">
    <line x1="598" y1="708" x2="598" y2="918"/><line x1="640" y1="708" x2="640" y2="918"/><line x1="682" y1="708" x2="682" y2="918"/>
    <line x1="556" y1="760" x2="724" y2="760"/><line x1="556" y1="812" x2="724" y2="812"/><line x1="556" y1="864" x2="724" y2="864"/>
  </g>
  <g transform="translate(540 720)">
    <circle cx="0" cy="0" r="30" fill="#d9e6ff" fill-opacity="0.16" stroke="#d9e6ff" stroke-opacity="0.4" stroke-width="2"/>
    <g stroke="#e8eefc" stroke-width="4" fill="none" stroke-linecap="round"><path d="M-13 -6 L 12 -6"/><path d="M6 -12 L 13 -6 L 6 0"/><path d="M13 6 L -12 6"/><path d="M-6 0 L -13 6 L -6 12"/></g>
  </g>
  <g transform="translate(740 720)">
    <circle cx="0" cy="0" r="30" fill="#d9e6ff" fill-opacity="0.16" stroke="#d9e6ff" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="0" cy="0" r="17" fill="none" stroke="#e8eefc" stroke-width="3"/>
    <rect x="-7" y="-9" width="5" height="18" rx="1.5" fill="#e8eefc"/><rect x="2" y="-9" width="5" height="18" rx="1.5" fill="#e8eefc"/>
  </g>
  <rect x="560" y="714" width="56" height="40" rx="4" fill="#0c0f17" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <g fill="#a64bd6"><rect x="579" y="725" width="9" height="9"/><rect x="570" y="735" width="9" height="9"/><rect x="579" y="735" width="9" height="9"/><rect x="588" y="735" width="9" height="9"/></g>
  <rect x="664" y="714" width="56" height="40" rx="4" fill="#0c0f17" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <g fill="#e88b2a"><rect x="675" y="735" width="9" height="9"/><rect x="684" y="735" width="9" height="9"/><rect x="693" y="735" width="9" height="9"/><rect x="693" y="725" width="9" height="9"/></g>

  <text x="512" y="812" text-anchor="end" font-size="25" fill="#9fb0cc">Hold + held</text>
  <text x="512" y="842" text-anchor="end" font-size="25" fill="#9fb0cc">piece</text>
  <text x="768" y="812" font-size="25" fill="#9fb0cc">Pause + next</text>
  <text x="768" y="842" font-size="25" fill="#9fb0cc">piece</text>
</svg>
